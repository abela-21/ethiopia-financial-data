{% extends "base.html" %}

{% block title %}Edit Profile - Ethiopia Economic Intelligence{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #FDF6E3 0%, #F4D47C 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg border-0" style="border-radius: 20px;">
                    <div class="card-body p-5">
                        <h2 class="fw-bold mb-1" style="color: #075056;">Edit Profile</h2>
                        <p class="text-muted mb-4">{{ user.email }}</p>

                        <form method="POST" action="{{ url_for('auth.edit_profile') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="first_name" class="form-label fw-semibold">First Name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name"
                                           value="{{ user.first_name }}" required maxlength="50">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="last_name" class="form-label fw-semibold">Last Name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name"
                                           value="{{ user.last_name }}" required maxlength="50">
                                </div>
                            </div>

                            <hr class="my-4">
                            <h6 class="fw-bold mb-1" style="color: #075056;">Change Password</h6>
                            <p class="text-muted small mb-3">Leave blank to keep your current password.</p>

                            <div class="mb-3">
                                <label for="current_password" class="form-label fw-semibold">Current Password</label>
                                <input type="password" class="form-control" id="current_password" name="current_password"
                                       autocomplete="current-password">
                            </div>
                            <div class="mb-4">
                                <label for="new_password" class="form-label fw-semibold">New Password</label>
                                <input type="password" class="form-control" id="new_password" name="new_password"
                                       minlength="6" autocomplete="new-password">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" style="background: #075056; border-color: #075056;">
                                    <i class="fas fa-save me-2"></i>Save Changes
                                </button>
                                <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
